<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/user :: head(#{feedback.password.title})}"></head>
<body>
<header th:replace="~{fragments/user :: appbar('lookup')}"></header>

<main class="container">
    <div class="card">
        <h1 class="headline" style="display:flex;align-items:center;gap:8px;">
            <span class="material-symbols-outlined">lock</span>
            <span th:text="#{feedback.password.title}">비밀글</span>
        </h1>
        <p class="subtitle" th:text="#{feedback.password.guide}">비밀번호를 입력하세요</p>

        <form th:action="@{/feedbacks/{id}/unlock(id=${feedbackId})}" method="post">
            <div class="field" th:classappend="${passwordError} ? 'has-error'">
                <label><span th:text="#{feedback.password.label}">비밀번호</span> <span class="req">*</span></label>
                <input type="password" name="password" autocomplete="off" autofocus required>
                <div class="error-text" th:if="${passwordError}" th:text="#{feedback.password.error}">불일치</div>
            </div>

            <!-- 캡차 -->
            <div class="field" th:classappend="${captchaError} ? 'has-error'">
                <label><span th:text="#{captcha.label}">자동입력 방지</span> <span class="req">*</span></label>
                <div class="captcha-row">
                    <img th:src="@{/captcha}" id="captchaImg" alt="captcha" th:title="#{captcha.reload}"
                         style="cursor:pointer;" data-captcha-reload>
                    <input type="text" name="captcha" inputmode="numeric" maxlength="6"
                           th:placeholder="#{captcha.placeholder}" autocomplete="off" required>
                </div>
                <div class="error-text" th:if="${captchaError}" th:text="#{captcha.invalid}">불일치</div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-filled btn-block">
                    <span class="material-symbols-outlined">lock_open</span>
                    <span th:text="#{feedback.password.submit}">확인</span>
                </button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/user :: scripts}"></div>
<script th:src="@{/js/captcha.js}"></script>
</body>
</html>
