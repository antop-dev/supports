<!DOCTYPE html>

<head th:replace="~{fragments/user :: head(#{error.403.title})}"></head>
<body>
<header th:replace="~{fragments/user :: appbar('')}"></header>
<main class="container">
    <div class="card" style="text-align:center;">
        <span class="material-symbols-outlined" style="font-size:3rem;color:var(--md-outline);">running_with_errors</span>
        <h1 class="headline" th:text="#{error.403.title}">요청 만료</h1>

        <div class="actions" style="justify-content:center;">
            <a th:href="@{/feedbacks/new}" class="btn btn-tonal" th:text="#{error.home}">처음으로</a>

    </div>
</main>
<div th:replace="~{fragments/user :: scripts}"></div>
