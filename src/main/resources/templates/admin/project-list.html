<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/admin :: head('프로젝트 관리')}"></head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col overflow-x-auto overflow-y-hidden">
<nav th:replace="~{fragments/admin :: navbar('projects')}"></nav>

<main class="flex-1 min-h-0 w-full max-w-[1200px] mx-auto px-4 py-4 flex flex-col gap-3">
    <!-- 툴바: 왼쪽 검색 입력 / 오른쪽 검색·초기화 버튼 + 추가 -->
    <div class="flex flex-wrap items-center gap-2">
        <form id="searchForm" class="flex-1 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <input type="text" id="q-name" placeholder="프로젝트명"
                       class="w-52 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
                <select id="q-enabled"
                        class="rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-2 py-2 text-sm">
                    <option value="">활성화</option>
                    <option value="true">활성</option>
                    <option value="false">비활성</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <button type="submit"
                        class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i><span>검색</span>
                </button>
                <button type="reset" id="resetBtn"
                        class="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
                        title="검색 조건 초기화">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </form>
        <span class="mx-1 h-6 w-px bg-gray-300 dark:bg-gray-600"></span>
        <button type="button" id="addBtn" title="프로젝트 추가"
                class="w-9 h-9 rounded-lg bg-green-600 hover:bg-green-700 text-white flex items-center justify-center">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>
    <p class="-mt-1 text-xs text-gray-500 dark:text-gray-400">
        셀을 클릭하면 바로 수정됩니다. 코드 옆 <i class="fa-solid fa-link"></i> 버튼을 누르면 그 프로젝트가 선택된 접수 폼 링크가 복사됩니다.
    </p>

    <!-- Grid.js 영역 -->
    <div id="grid" class="grid-host flex-1 min-h-0"
         th:attr="data-url=@{/admin/projects/data},data-base=@{/admin/projects},data-form=@{/feedbacks/new}"></div>
</main>

<!-- 프로젝트 등록 팝업 -->
<div id="projectModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-4">
    <div class="w-[440px] rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-xl p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">
                <i class="fa-solid fa-folder-plus"></i><span>프로젝트 추가</span>
            </h2>
            <button type="button" class="text-gray-400 hover:text-gray-200" data-modal-close>
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-sm font-medium mb-1">프로젝트명</label>
                <input type="text" id="p-name" maxlength="100"
                       class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">코드</label>
                <input type="text" id="p-code" maxlength="50" placeholder="미입력 시 프로젝트명에서 자동 생성"
                       class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm">
                <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
                    접수 폼 링크(<code>?project=코드</code>)에 쓰입니다. 영문 소문자·숫자·하이픈(-)만 가능합니다.
                </p>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">정렬 순서</label>
                <input type="number" id="p-sortOrder" value="0"
                       class="w-32 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">프로젝트 URL</label>
                <input type="text" id="p-url" maxlength="500" placeholder="https://"
                       class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" id="p-enabled" checked class="w-4 h-4">
                <span>활성화</span>
            </label>
            <p id="p-error" class="hidden text-sm text-red-500"></p>
        </div>

        <div class="flex justify-end gap-2 mt-6">
            <button type="button" data-modal-close
                    class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">취소</button>
            <button type="button" id="p-save"
                    class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium">등록</button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin :: scripts}"></div>
<div th:replace="~{fragments/admin :: grid-scripts}"></div>
<script th:src="@{/js/admin-project-grid.js}"></script>
</body>
</html>
