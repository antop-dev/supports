<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/admin :: head('계정 관리')}"></head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col overflow-x-auto overflow-y-hidden">
<nav th:replace="~{fragments/admin :: navbar('accounts')}"></nav>

<main class="flex-1 min-h-0 w-full max-w-[1200px] mx-auto px-4 py-4 flex flex-col gap-3">
    <!-- 툴바: 왼쪽 검색 입력 / 오른쪽 검색·초기화 버튼 + 추가 -->
    <div class="flex flex-wrap items-center gap-2">
        <form id="searchForm" class="flex-1 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <input type="text" id="q-username" placeholder="아이디"
                       class="w-52 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>

            <div class="flex items-center gap-2">
                <button type="submit"
                        class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i><span>검색</span>
                </button>
                <button type="reset" id="resetBtn"
                        class="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
                        title="검색 조건 초기화">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </form>
        <span class="mx-1 h-6 w-px bg-gray-300 dark:bg-gray-600"></span>
        <button type="button" id="addBtn" title="계정 추가"
                class="w-9 h-9 rounded-lg bg-green-600 hover:bg-green-700 text-white flex items-center justify-center">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>
    <p class="-mt-1 text-xs text-gray-500 dark:text-gray-400">비밀번호는 이 화면에서 변경할 수 없습니다.</p>

    <!-- Grid.js 영역 -->
    <div id="grid" class="grid-host flex-1 min-h-0"
         th:attr="data-url=@{/admin/accounts/data},data-base=@{/admin/accounts}"></div>
</main>

<!-- 계정 등록 팝업 -->
<div id="accountModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-4">
    <div class="w-[440px] rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-xl p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i><span>계정 추가</span>
            </h2>
            <button type="button" class="text-gray-400 hover:text-gray-200" data-modal-close>
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-sm font-medium mb-1">아이디</label>
                <input type="text" id="a-username" maxlength="50" autocomplete="off"
                       class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm">
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">영문/숫자/._- 3~50자</p>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">비밀번호</label>
                <input type="password" id="a-password" autocomplete="new-password"
                       class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm">
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">8자 이상 입력하세요.</p>
            </div>
            <p id="a-error" class="hidden text-sm text-red-500"></p>
        </div>

        <div class="flex justify-end gap-2 mt-6">
            <button type="button" data-modal-close
                    class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">취소</button>
            <button type="button" id="a-save"
                    class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium">등록</button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin :: scripts}"></div>
<div th:replace="~{fragments/admin :: grid-scripts}"></div>
<script th:src="@{/js/admin-account-grid.js}"></script>
</body>
</html>
